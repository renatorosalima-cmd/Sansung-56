<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<title>Cine Manual Web V2.1</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#app{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
}

/* CÂMERA */

#preview{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;

    /*
       COVER = ocupa toda a tela.
       Não estica a imagem.
       Se a proporção for diferente,
       corta apenas o excesso.
    */
    object-fit:cover;

    object-position:center center;

    background:#000;

    transform-origin:center center;

    transition:transform .12s ease;
}


/* INTERFACE */

#topBar,
#bottomBar{
    position:absolute;
    left:0;
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;

    gap:6px;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom))
        8px;

    background:rgba(0,0,0,.62);

    z-index:20;
}

#topBar{
    top:0;
    padding-top:
        calc(8px + env(safe-area-inset-top));
}

#bottomBar{
    bottom:0;
}


/* BOTÕES */

button,
select{
    background:#151515;
    color:#fff;

    border:1px solid #666;

    border-radius:8px;

    padding:8px 10px;

    font-size:13px;
}

button:active{
    transform:scale(.96);
}

button.rec{
    border-color:#b00000;
}


/* ZOOM */

#zoom{
    width:150px;
}

#zoomLabel{
    min-width:45px;
    color:white;
    font-size:13px;
    text-align:center;
}


/* GRADE */

#guides{
    position:absolute;
    inset:0;

    pointer-events:none;

    z-index:5;
}

.guide{
    position:absolute;
    background:rgba(255,255,255,.35);
}

.v1{
    left:33.333%;
    top:0;
    width:1px;
    height:100%;
}

.v2{
    left:66.666%;
    top:0;
    width:1px;
    height:100%;
}

.h1{
    top:33.333%;
    left:0;
    height:1px;
    width:100%;
}

.h2{
    top:66.666%;
    left:0;
    height:1px;
    width:100%;
}


/* MÁSCARA CINEMATOGRÁFICA */

.letter{
    position:absolute;

    left:0;

    width:100%;

    background:#000;

    display:none;

    z-index:8;

    pointer-events:none;
}


/* MENSAGEM */

#message{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    color:white;

    text-align:center;

    font-size:16px;

    background:rgba(0,0,0,.55);

    padding:15px 20px;

    border-radius:10px;

    z-index:30;
}


/* REC */

#recDot{
    display:inline-block;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#777;

    margin-right:5px;
}

.recording #recDot{
    background:red;

    box-shadow:
        0 0 12px red;
}

#timer{
    color:white;

    font-weight:bold;

    min-width:55px;

    text-align:center;
}


/* INFORMAÇÕES */

#status{
    width:100%;

    text-align:center;

    color:#ddd;

    font-size:11px;

    padding:
        2px
        5px;
}


/* RESPONSIVO */

@media(max-width:600px){

    button,
    select{

        font-size:12px;

        padding:7px 8px;

    }

    #zoom{
        width:110px;
    }

}

</style>
</head>


<body>

<div id="app">


<!-- CÂMERA -->

<video
    id="preview"
    autoplay
    playsinline
    muted>
</video>


<!-- GRADE -->

<div id="guides">

    <div class="guide v1"></div>
    <div class="guide v2"></div>

    <div class="guide h1"></div>
    <div class="guide h2"></div>

</div>


<!-- BARRAS CINEMATOGRÁFICAS -->

<div
    id="topLetter"
    class="letter">
</div>

<div
    id="bottomLetter"
    class="letter">
</div>


<!-- TOPO -->

<div id="topBar">

    <button id="openCamera">
        📷 Abrir câmera
    </button>


    <button id="flipCamera">
        🔄 Trocar
    </button>


    <select id="resolution">

        <option value="auto">
            Auto
        </option>

        <option value="1920x1080">
            1080p
        </option>

        <option value="1280x720">
            720p
        </option>

        <option value="3840x2160">
            4K
        </option>

    </select>


    <select id="fps">

        <option value="auto">
            Auto
        </option>

        <option value="24">
            24 FPS
        </option>

        <option value="25">
            25 FPS
        </option>

        <option value="30">
            30 FPS
        </option>

        <option value="60">
            60 FPS
        </option>

    </select>


    <select id="aspect">

        <option value="normal">
            Normal
        </option>

        <option value="2.39">
            Cinema 2.39:1
        </option>

        <option value="2.35">
            Cinema 2.35:1
        </option>

    </select>

</div>


<!-- RODAPÉ -->

<div id="bottomBar">


    <button id="gridButton">
        Grade ON
    </button>


    <input
        id="zoom"
        type="range"
        min="1"
        max="4"
        step="0.1"
        value="1"
    >


    <span id="zoomLabel">
        1.0×
    </span>


    <button
        id="recordButton"
        class="rec">

        <span id="recDot"></span>

        <span id="recText">
            REC
        </span>

    </button>


    <span id="timer">
        00:00
    </span>


    <div id="status">
        Aguardando câmera
    </div>

</div>


<!-- MENSAGEM -->

<div id="message">

    Toque em
    <b>“Abrir câmera”</b>

</div>


</div>


<script>

/* =====================================
   VARIÁVEIS
===================================== */

let stream = null;

let recorder = null;

let chunks = [];

let recording = false;

let facing = "environment";

let timerInterval = null;

let recordingStart = 0;

let realZoomSupported = false;


/* =====================================
   ELEMENTOS
===================================== */

const video =
    document.getElementById(
        "preview"
    );

const message =
    document.getElementById(
        "message"
    );

const status =
    document.getElementById(
        "status"
    );

const zoom =
    document.getElementById(
        "zoom"
    );

const zoomLabel =
    document.getElementById(
        "zoomLabel"
    );


/* =====================================
   MENSAGEM
===================================== */

function showMessage(text){

    message.innerHTML = text;

    message.style.display =
        text ? "block" : "none";

}


/* =====================================
   STATUS
===================================== */

function setStatus(text){

    status.textContent = text;

}


/* =====================================
   PARAR CÂMERA
===================================== */

function stopCamera(){

    if(stream){

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        stream = null;

    }

}


/* =====================================
   ABRIR CÂMERA
===================================== */

async function openCamera(){

    stopCamera();

    const resolution =
        document.getElementById(
            "resolution"
        ).value;

    const fps =
        document.getElementById(
            "fps"
        ).value;


    const videoConstraints = {

        facingMode:{
            ideal:facing
        }

    };


    /* RESOLUÇÃO */

    if(resolution !== "auto"){

        const parts =
            resolution.split("x");

        videoConstraints.width = {

            ideal:
                Number(parts[0])

        };

        videoConstraints.height = {

            ideal:
                Number(parts[1])

        };

    }


    /* FPS */

    if(fps !== "auto"){

        videoConstraints.frameRate = {

            ideal:Number(fps),

            max:Number(fps)

        };

    }


    try{

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    audio:true,

                    video:
                        videoConstraints

                });


        video.srcObject =
            stream;


        await video.play();


        const track =
            stream
                .getVideoTracks()[0];


        const settings =
            track.getSettings();


        const capabilities =
            track.getCapabilities
                ? track.getCapabilities()
                : {};


        /* =================================
           ZOOM REAL
        ================================= */

        if(capabilities.zoom){

            realZoomSupported = true;


            zoom.min =
                capabilities.zoom.min || 1;

            zoom.max =
                Math.min(
                    capabilities.zoom.max || 4,
                    8
                );

            zoom.step =
                capabilities.zoom.step || .1;

        }

        else{

            realZoomSupported = false;

            zoom.min = 1;

            zoom.max = 4;

            zoom.step = .1;

        }


        zoom.value = 1;

        applyZoom();


        /* =================================
           INFORMAÇÕES
        ================================= */

        setStatus(

            `${settings.width || "?"} × ` +
            `${settings.height || "?"} • ` +
            `${Math.round(settings.frameRate || 0)} FPS`

        );


        showMessage("");


    }

    catch(error){

        console.error(error);

        showMessage(

            "Não foi possível abrir a câmera.<br><br>" +

            "<small>" +

            "Verifique a permissão da câmera " +

            "e se o site está usando HTTPS."

            +

            "</small>"

        );


        setStatus(
            error.name || "Erro"
        );

    }

}


/* =====================================
   ZOOM
===================================== */

async function applyZoom(){

    const value =
        Number(zoom.value);


    zoomLabel.textContent =
        value.toFixed(1) + "×";


    if(
        realZoomSupported &&
        stream
    ){

        try{

            const track =
                stream
                    .getVideoTracks()[0];


            await track.applyConstraints({

                advanced:[
                    {
                        zoom:value
                    }
                ]

            });


            /*
             Não aplica scale quando
             o zoom real da câmera funciona.
            */

            video.style.transform =
                "scale(1)";


            return;

        }

        catch(error){

            console.log(
                "Zoom real não disponível."
            );

        }

    }


    /*
       RESERVA:
       zoom visual.
    */

    video.style.transform =
        `scale(${value})`;

}


zoom.addEventListener(
    "input",
    applyZoom
);


/* =====================================
   TROCAR CÂMERA
===================================== */

document
    .getElementById(
        "flipCamera"
    )
    .addEventListener(
        "click",
        function(){

            facing =
                facing === "environment"
                    ? "user"
                    : "environment";


            openCamera();

        }
    );


/* =====================================
   BOTÃO CÂMERA
===================================== */

document
    .getElementById(
        "openCamera"
    )
    .addEventListener(
        "click",
        openCamera
    );


/* =====================================
   GRADE
===================================== */

document
    .getElementById(
        "gridButton"
    )
    .addEventListener(
        "click",
        function(){

            const guides =
                document.getElementById(
                    "guides"
                );


            const visible =
                guides.style.display !==
                "none";


            if(visible){

                guides.style.display =
                    "none";

                this.textContent =
                    "Grade OFF";

            }

            else{

                guides.style.display =
                    "block";

                this.textContent =
                    "Grade ON";

            }

        }
    );


/* =====================================
   CINEMA 2.39 / 2.35
===================================== */

function updateCinemaBars(){

    const mode =
        document.getElementById(
            "aspect"
        ).value;


    const top =
        document.getElementById(
            "topLetter"
        );

    const bottom =
        document.getElementById(
            "bottomLetter"
        );


    if(mode === "normal"){

        top.style.display =
            "none";

        bottom.style.display =
            "none";

        return;

    }


    const ratio =
        Number(mode);


    const screenWidth =
        window.innerWidth;


    const desiredHeight =
        screenWidth / ratio;


    const screenHeight =
        window.innerHeight;


    const totalBars =
        screenHeight -
        desiredHeight;


    if(totalBars > 0){

        const barHeight =
            totalBars / 2;


        top.style.display =
            "block";

        bottom.style.display =
            "block";


        top.style.height =
            barHeight + "px";


        bottom.style.height =
            barHeight + "px";


        top.style.top =
            "0";

        bottom.style.bottom =
            "0";

    }

    else{

        top.style.display =
            "none";

        bottom.style.display =
            "none";

    }

}


document
    .getElementById(
        "aspect"
    )
    .addEventListener(
        "change",
        updateCinemaBars
    );


window.addEventListener(
    "resize",
    updateCinemaBars
);


/* =====================================
   FORMATOS DE GRAVAÇÃO
===================================== */

function getMimeType(){

    const formats = [

        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

        "video/mp4",

        "video/webm;codecs=vp9,opus",

        "video/webm"

    ];


    for(
        const format
        of formats
    ){

        if(
            MediaRecorder
                .isTypeSupported(format)
        ){

            return format;

        }

    }


    return "";

}


/* =====================================
   COMEÇAR GRAVAÇÃO
===================================== */

function startRecording(){

    const mime =
        getMimeType();


    if(!mime){

        showMessage(
            "Seu navegador não oferece " +
            "um formato de gravação compatível."
        );

        return;

    }


    try{

        recorder =
            new MediaRecorder(

                stream,

                {

                    mimeType:mime,

                    videoBitsPerSecond:
                        20000000

                }

            );

    }

    catch(error){

        recorder =
            new MediaRecorder(
                stream
            );

    }


    chunks = [];


    recorder.ondataavailable =
        function(event){

            if(event.data.size){

                chunks.push(
                    event.data
                );

            }

        };


    recorder.onstop =
        saveRecording;


    recorder.start(1000);


    recording = true;


    document.body
        .classList
        .add(
            "recording"
        );


    document.getElementById(
        "recText"
    ).textContent =
        "PARAR";


    recordingStart =
        Date.now();


    timerInterval =
        setInterval(
            updateTimer,
            250
        );


    setStatus(
        "🔴 Gravando"
    );

}


/* =====================================
   CRONÔMETRO
===================================== */

function updateTimer(){

    const elapsed =
        Math.floor(

            (
                Date.now() -
                recordingStart
            ) / 1000

        );


    const minutes =
        Math.floor(
            elapsed / 60
        );


    const seconds =
        elapsed % 60;


    document.getElementById(
        "timer"
    ).textContent =

        String(minutes)
            .padStart(2,"0")

        +

        ":"

        +

        String(seconds)
            .padStart(2,"0");

}


/* =====================================
   PARAR GRAVAÇÃO
===================================== */

function stopRecording(){

    if(
        recorder &&
        recording
    ){

        recorder.stop();

    }


    recording = false;


    document.body
        .classList
        .remove(
            "recording"
        );


    document.getElementById(
        "recText"
    ).textContent =
        "REC";


    clearInterval(
        timerInterval
    );


    setStatus(
        "Processando vídeo..."
    );

}


/* =====================================
   SALVAR VÍDEO
===================================== */

function saveRecording(){

    const type =
        recorder.mimeType ||
        "video/webm";


    const blob =
        new Blob(
            chunks,
            {
                type:type
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    const extension =
        type.includes("mp4")
            ? "mp4"
            : "webm";


    link.download =

        "CINE_" +

        new Date()
            .toISOString()
            .replace(
                /[:.]/g,
                "-"
            )

        +

        "." +

        extension;


    link.click();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        3000
    );


    setStatus(
        "Vídeo salvo"
    );

}


/* =====================================
   BOTÃO REC
===================================== */

document
    .getElementById(
        "recordButton"
    )
    .addEventListener(
        "click",
        function(){

            if(!stream){

                showMessage(
                    "Primeiro abra a câmera."
                );

                return;

            }


            if(recording){

                stopRecording();

            }

            else{

                startRecording();

            }

        }
    );


/* =====================================
   INICIALIZAÇÃO
===================================== */

updateCinemaBars();

</script>

</body>
</html>
