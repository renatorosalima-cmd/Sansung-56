<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Cine Manual Web V3</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
overflow:hidden;
font-family:Arial,sans-serif;
color:#fff
}

#app{
position:fixed;
inset:0;
background:#000;
overflow:hidden
}

#preview{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
object-position:center;
background:#000;
transform-origin:center;
transition:transform .12s
}

#touch{
position:absolute;
inset:0;
z-index:12;
touch-action:none
}

.bar{
position:absolute;
left:0;
width:100%;
z-index:30;
display:flex;
align-items:center;
justify-content:center;
flex-wrap:wrap;
gap:5px;
background:rgba(0,0,0,.68);
padding:6px
}

#topBar{
top:0;
padding-top:calc(6px + env(safe-area-inset-top))
}

#bottomBar{
bottom:0;
padding-bottom:calc(6px + env(safe-area-inset-bottom))
}

button,select,input{
font:inherit
}

button,select{
background:#151515;
color:#fff;
border:1px solid #666;
border-radius:8px;
padding:7px 8px;
font-size:11px
}

button:active{
transform:scale(.96)
}

.rec{
border-color:#b00000
}

#zoom{
width:105px
}

.value{
min-width:42px;
text-align:center;
font-size:11px
}

#status{
width:100%;
text-align:center;
font-size:9px;
color:#ddd
}

#recDot{
display:inline-block;
width:9px;
height:9px;
border-radius:50%;
background:#777;
margin-right:4px
}

.recording #recDot{
background:red;
box-shadow:0 0 10px red
}

#timer{
min-width:52px;
text-align:center;
font-weight:bold;
font-size:11px
}

#guides{
position:absolute;
inset:0;
z-index:7;
pointer-events:none
}

.guide{
position:absolute;
background:rgba(255,255,255,.32)
}

.v1{
left:33.333%;
top:0;
width:1px;
height:100%
}

.v2{
left:66.666%;
top:0;
width:1px;
height:100%
}

.h1{
top:33.333%;
left:0;
height:1px;
width:100%
}

.h2{
top:66.666%;
left:0;
height:1px;
width:100%
}

.letter{
position:absolute;
left:0;
width:100%;
background:#000;
z-index:8;
display:none;
pointer-events:none
}

#message{
position:absolute;
z-index:50;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:rgba(0,0,0,.72);
padding:15px 20px;
border-radius:10px;
text-align:center;
max-width:90%
}

#focusBox{
position:absolute;
z-index:20;
width:64px;
height:64px;
border:2px solid #fff;
border-radius:3px;
display:none;
transform:translate(-50%,-50%);
pointer-events:none
}

.show{
display:block!important
}

#exposureLine{
position:absolute;
z-index:21;
width:3px;
height:82px;
background:#fff;
border-radius:3px;
display:none;
transform:translate(-50%,-50%);
pointer-events:none
}

#manualPanel,
#toolsPanel{
position:absolute;
z-index:45;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(390px,92vw);
max-height:80vh;
overflow:auto;
background:rgba(0,0,0,.94);
border:1px solid #666;
border-radius:12px;
padding:14px;
display:none
}

h3{
margin:0 0 12px;
text-align:center;
font-size:15px
}

.row{
display:flex;
align-items:center;
gap:7px;
margin:9px 0
}

.row label{
width:105px;
font-size:11px
}

.row input,
.row select{
flex:1
}

.small{
font-size:9px;
color:#aaa;
text-align:center;
line-height:1.4
}

.toolState{
display:flex;
justify-content:space-between;
align-items:center;
margin:8px 0;
font-size:11px
}

#histogram{
position:absolute;
right:8px;
top:80px;
width:150px;
height:70px;
background:rgba(0,0,0,.45);
border:1px solid rgba(255,255,255,.45);
z-index:18;
display:none
}

#level{
position:absolute;
left:50%;
top:50%;
width:120px;
height:2px;
background:#fff;
transform:translate(-50%,-50%);
z-index:17;
display:none;
opacity:.8
}

#levelDot{
position:absolute;
left:50%;
top:50%;
width:10px;
height:10px;
border:2px solid #fff;
border-radius:50%;
transform:translate(-50%,-50%);
z-index:18;
display:none
}

#zebra{
position:absolute;
inset:0;
z-index:16;
pointer-events:none;
display:none;
opacity:.28;
background:
repeating-linear-gradient(
135deg,
transparent 0 7px,
#fff 7px 9px
)
}

@media(max-width:600px){

button,select{
font-size:11px;
padding:7px 7px
}

}
</style>
</head>

<body>

<div id="app">

<video
id="preview"
autoplay
playsinline
muted>
</video>

<div id="touch"></div>

<div id="guides">

<div class="guide v1"></div>
<div class="guide v2"></div>
<div class="guide h1"></div>
<div class="guide h2"></div>

</div>

<div id="zebra"></div>

<canvas id="histogram"></canvas>

<div id="level"></div>
<div id="levelDot"></div>

<div id="focusBox"></div>
<div id="exposureLine"></div>

<div id="topLetter" class="letter"></div>
<div id="bottomLetter" class="letter"></div>


<!-- PAINEL MANUAL -->

<div id="manualPanel">

<h3>🎛️ CONTROLES MANUAIS</h3>

<div class="row">

<label>☀ Exposição</label>

<input
id="exposure"
type="range"
min="-2"
max="2"
step=".1"
value="0">

<span
