<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><title>Cine Manual Web V1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}
#app{position:fixed;inset:0;background:#000}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.bar{pointer-events:auto;background:rgba(0,0,0,.55);padding:8px;display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
button,select,input{font:inherit}button,select{background:#171717;color:#fff;border:1px solid #555;border-radius:8px;padding:8px 11px}
button:disabled{opacity:.4}.rec{border-color:#b00000}.value{font-size:13px;min-width:60px;text-align:center}
#zoom{width:180px}.guide{position:absolute;background:rgba(255,255,255,.35);pointer-events:none}
.v1{left:33.333%;top:0;width:1px;height:100%}.v2{left:66.666%;top:0;width:1px;height:100%}
.h1{top:33.333%;left:0;height:1px;width:100%}.h2{top:66.666%;left:0;height:1px;width:100%}
#msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#ccc;max-width:90%;pointer-events:none}
#recDot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#777;margin-right:5px}
.recording #recDot{background:red;box-shadow:0 0 10px red}
#timer{font-weight:bold;min-width:65px;text-align:center}.small{font-size:12px;color:#bbb}
</style></head><body>
<div id="app">
<video id="preview" autoplay playsinline muted></video>
<div id="guides"><i class="guide v1"></i><i class="guide v2"></i><i class="guide h1"></i><i class="guide h2"></i></div>
<div id="ui">
<div class="bar">
<button id="start">📷 Abrir câmera</button><button id="flip">🔄 Trocar</button>
<select id="resolution"><option value="1920x1080">1080p</option><option value="1280x720">720p</option><option value="3840x2160">4K</option></select>
<select id="fps"><option>24</option><option>30</option><option>60</option></select>
<span class="value" id="zoomLabel">1.0×</span>
</div>
<div class="bar">
<input id="zoom" type="range" min="1" max="4" step=".1" value="1">
<button id="guidesBtn">Guias ON</button><button id="record" class="rec"><span id="recDot"></span><span id="recText">REC</span></button>
<span id="timer">00:00</span><span class="small" id="status">Aguardando câmera</span>
</div></div>
<div id="msg">Toque em <b>“Abrir câmera”</b> para começar.</div>
</div>
<script>
const v=document.getElementById('preview'),msg=document.getElementById('msg'),status=document.getElementById('status');
let stream=null,recorder=null,chunks=[],facing='environment',recording=false,timerId=null,started=0;
const setStatus=x=>status.textContent=x;
const show=x=>{msg.innerHTML=x;msg.style.display=x?'block':'none'};
function stopStream(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function openCamera(){
 stopStream(); const [w,h]=resolution.value.split('x').map(Number),fps=Number(document.getElementById('fps').value);
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:{ideal:facing},width:{ideal:w},height:{ideal:h},frameRate:{ideal:fps,max:fps}}});
  v.srcObject=stream; await v.play(); const s=stream.getVideoTracks()[0].getSettings();
  setStatus(`${s.width||'?'}×${s.height||'?'} • ${s.frameRate||'?'} fps`); show('');
 }catch(e){show('Não foi possível abrir a câmera.<br><small>Use HTTPS e permita o acesso à câmera.</small>');setStatus(e.name||'Erro')}
}
start.onclick=openCamera; flip.onclick=()=>{facing=facing==='environment'?'user':'environment';openCamera()};
zoom.oninput=()=>{v.style.transform=`scale(${zoom.value})`;zoomLabel.textContent=Number(zoom.value).toFixed(1)+'×'};
guidesBtn.onclick=()=>{let on=guides.style.display!=='none';guides.style.display=on?'none':'block';guidesBtn.textContent=on?'Guias OFF':'Guias ON'};
function mime(){return ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||''}
record.onclick=()=>{if(!stream){show('Primeiro abra a câmera.');return} recording?stopRecording():startRecording()};
function startRecording(){
 let m=mime(); if(!m){show('Formato de gravação não suportado neste navegador.');return}
 try{recorder=new MediaRecorder(stream,{mimeType:m,videoBitsPerSecond:20000000})}catch(e){recorder=new MediaRecorder(stream)}
 chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=save;recorder.start(1000);
 recording=true;document.body.classList.add('recording');recText.textContent='PARAR';started=Date.now();timer.textContent='00:00';
 timerId=setInterval(()=>{let s=Math.floor((Date.now()-started)/1000);timer.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250);setStatus('Gravando…')
}
function stopRecording(){if(recorder&&recording)recorder.stop();recording=false;document.body.classList.remove('recording');recText.textContent='REC';clearInterval(timerId);setStatus('Processando…')}
function save(){let type=recorder.mimeType||'video/webm',blob=new Blob(chunks,{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CINE_'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+(type.includes('mp4')?'mp4':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);setStatus('Download iniciado')}
window.addEventListener('beforeunload',stopStream);
</script></body></html>
