<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover">

<meta name="theme-color"
content="#000000">

<title>Cine Manual Web V2.2</title>


<style>

*{
box-sizing:border-box;
}

html,
body{

margin:0;
padding:0;

width:100%;
height:100%;

background:#000;

overflow:hidden;

font-family:Arial,sans-serif;

color:white;

}


#app{

position:fixed;

inset:0;

background:#000;

overflow:hidden;

}


/* =========================
   CÂMERA
========================= */

#preview{

position:absolute;

inset:0;

width:100%;
height:100%;

object-fit:cover;

object-position:center;

background:#000;

transform-origin:center;

transition:transform .12s;

}


/* =========================
   BARRAS
========================= */

#topBar,
#bottomBar{

position:absolute;

left:0;

width:100%;

z-index:20;

display:flex;

align-items:center;

justify-content:center;

flex-wrap:wrap;

gap:6px;

background:rgba(0,0,0,.65);

padding:7px;

}


#topBar{

top:0;

padding-top:
calc(7px + env(safe-area-inset-top));

}


#bottomBar{

bottom:0;

padding-bottom:
calc(7px + env(safe-area-inset-bottom));

}


/* =========================
   BOTÕES
========================= */

button,
select{

background:#151515;

color:white;

border:1px solid #666;

border-radius:8px;

padding:7px 9px;

font-size:12px;

}


button:active{

transform:scale(.96);

}


.rec{

border-color:#b00000;

}


/* =========================
   ZOOM
========================= */

#zoom{

width:110px;

}


.value{

min-width:45px;

text-align:center;

font-size:12px;

}


/* =========================
   REC
========================= */

#recDot{

display:inline-block;

width:10px;

height:10px;

border-radius:50%;

background:#777;

margin-right:5px;

}


.recording #recDot{

background:red;

box-shadow:
0 0 12px red;

}


#timer{

min-width:55px;

text-align:center;

font-weight:bold;

font-size:12px;

}


/* =========================
   STATUS
========================= */

#status{

width:100%;

text-align:center;

font-size:10px;

color:#ddd;

}


/* =========================
   GRADE
========================= */

#guides{

position:absolute;

inset:0;

z-index:5;

pointer-events:none;

}


.guide{

position:absolute;

background:
rgba(255,255,255,.35);

}


.v1{

left:33.333%;

top:0;

width:1px;

height:100%;

}


.v2{

left:66.666%;

top:0;

width:1px;

height:100%;

}


.h1{

top:33.333%;

left:0;

height:1px;

width:100%;

}


.h2{

top:66.666%;

left:0;

height:1px;

width:100%;

}


/* =========================
   CINEMA
========================= */

.letter{

position:absolute;

left:0;

width:100%;

background:#000;

z-index:8;

display:none;

pointer-events:none;

}


/* =========================
   MENSAGEM
========================= */

#message{

position:absolute;

z-index:30;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

background:
rgba(0,0,0,.65);

padding:15px 20px;

border-radius:10px;

text-align:center;

max-width:90%;

}


/* =========================
   PAINEL MANUAL
========================= */

#manualPanel{

position:absolute;

z-index:25;

left:50%;

top:50%;

transform:
translate(-50%,-50%);

width:min(360px,90vw);

background:
rgba(0,0,0,.88);

border:
1px solid #666;

border-radius:12px;

padding:14px;

display:none;

}


#manualPanel h3{

margin:0 0 12px;

text-align:center;

font-size:15px;

}


.control{

display:flex;

align-items:center;

gap:8px;

margin:10px 0;

}


.control label{

width:90px;

font-size:12px;

}


.control input,
.control select{

flex:1;

}


.manualInfo{

font-size:10px;

color:#aaa;

text-align:center;

margin-top:10px;

line-height:1.4;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

button,
select{

font-size:12px;

padding:7px 8px;

}

#zoom{

width:105px;

}

}

</style>

</head>

<script>


/* =========================
   VARIÁVEIS
========================= */

let stream = null;

let videoTrack = null;

let capabilities = {};

let facingMode =
"environment";

let realZoom = false;

let recorder = null;

let recordedChunks = [];

let recording = false;

let recordingStart = 0;

let timerInterval = null;



/* =========================
   ATALHO
========================= */

function $(id){

return document.getElementById(id);

}



/* =========================
   MENSAGEM
========================= */

function showMessage(text){

$("message").innerHTML =
text;

$("message").style.display =
text ? "block" : "none";

}



/* =========================
   STATUS
========================= */

function setStatus(text){

$("status").textContent =
text;

}



/* =========================
   PARAR CÂMERA
========================= */

function stopCamera(){

if(stream){

stream
.getTracks()
.forEach(
track => track.stop()
);

stream = null;

videoTrack = null;

}

}



/* =========================
   CONFIGURAÇÃO
========================= */

function createConstraints(){


let video = {

facingMode:{
ideal:facingMode
}

};


let resolution =
$("resolution").value;


let fps =
$("fps").value;



if(
resolution !== "auto"
){

let parts =
resolution.split("x");

let width =
Number(parts[0]);

let height =
Number(parts[1]);


video.width = {

ideal:width

};


video.height = {

ideal:height

};

}



if(
fps !== "auto"
){

video.frameRate = {

ideal:Number(fps),

max:Number(fps)

};

}


return {

audio:true,

video:video

};

}



/* =========================
   ABRIR CÂMERA
========================= */

async function openCamera(){

stopCamera();


try{


stream =
await navigator
.mediaDevices
.getUserMedia(
createConstraints()
);


$("preview").srcObject =
stream;


await $("preview").play();


videoTrack =
stream
.getVideoTracks()[0];


capabilities =
videoTrack
.getCapabilities
?
videoTrack.getCapabilities()
:
{};


configureControls();


const settings =
videoTrack.getSettings();


setStatus(

(settings.width || "?")
+
" × "
+
(settings.height || "?")
+
" • "
+
Math.round(
settings.frameRate || 0
)
+
" FPS"

);


$("zoom").value = 1;

applyZoom();

updateCinema();


showMessage("");


}

catch(error){

console.error(error);


showMessage(

"Não foi possível abrir a câmera.<br><br>" +

"<small>" +

"Verifique a permissão da câmera " +

"e se o site está usando HTTPS."

+

"</small>"

);


setStatus(
error.name ||
"Erro"
);

}

}



/* =========================

========================= */

if(

){

realZoom = true;


$("zoom").min =
capabilities.zoom.min || 1;


$("zoom").max =
Math.min(
capabilities.zoom.max || 4,
8
);


$("zoom").step =
capabilities.zoom.step || .1;

}

else{

realZoom = false;


$("zoom").min = 1;

$("zoom").max = 4;

$("zoom").step = .1;

}



/* EXPOSIÇÃO */

let exposure =
capabilities.exposureCompensation;


if(exposure){

$("exposure").disabled =
false;


$("exposure").min =
exposure.min;


$("exposure").max =
exposure.max;


$("exposure").step =
exposure.step || .1;

}

else{

$("exposure").disabled =
true;

}



/* FOCO */

let focusModes =
capabilities.focusMode;


$("focusMode").innerHTML =
"";


if(
Array.isArray(focusModes)
&&
focusModes.length
){

$("focusMode").disabled =
false;


focusModes.forEach(
mode => {


let option =
document.createElement(
"option"
);


option.value =
mode;


if(
mode ===
"continuous"
){

option.textContent =
"Contínuo";

}

else if(
mode ===
"single-shot"
){

option.textContent =
"Toque";

}

else if(
mode ===
"manual"
){

option.textContent =
"Manual";

}

else{

option.textContent =
mode;

}


$("focusMode")
.appendChild(option);

}

);

}

else{

$("focusMode").disabled =
true;


$("focusMode").innerHTML =

"<option>" +

"Não disponível" +

"</option>";

}



/* WHITE BALANCE */

let wb =
capabilities.whiteBalanceMode;


$("whiteBalance").innerHTML =
"";


if(
Array.isArray(wb)
&&
wb.length
){

$("whiteBalance").disabled =
false;


wb.forEach(
mode => {


let option =
